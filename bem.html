<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bem.css">
</head>
<body>
    <header class="header">
        <div class="header__block1">
            <div class="header__logo">
                <img src="img/Vector.svg" width="177px" height="41px">
            </div>
            <div class="header__search-box">
                <img src="search-lg.svg" width="12px" height="12px">
                <input type="text" placeholder="Search">
            </div>
        </div>
        <div class="header__block2">
            <nav class="header__nav">
                <a href="#" class="header__nav-link header__nav-link--active">Products</a>
                <a href="#" class="header__nav-link">Services</a>
                <a href="#" class="header__nav-link">Expertise</a>
                <a href="#" class="header__nav-link">About</a>
            </nav>
            <div class="header__btn">
                <button class="header__button">Login / Signup</button>
            </div>
        </div>
    </header>
    <main class="cards">
        <div class="cards__card">
            <img src="img/img-2.svg" alt="cupcake" width="380px" height="245px">
            <div class="cards__block">
                <div class="cards__title">Кремовый замок</div>
                <div class="cards__desc">Нежный крем любого цвета <br>на выбор, вафельная основа</div>
                <div class="cards__price">150 ₽/шт. </div>
                <button class="cards__button">Заказать</button>
            </div>
        </div>
        <div class="cards__card">
            <img src="img/img-3.svg" alt="cupcake" width="380px" height="245px" >
            <div class="cards__block">
                <div class="cards__title">Малиновый рай</div>
                <div class="cards__desc">Воздушный крем, темная<br> основа и ягода малины</div>
                <div class="cards__price">150 ₽/шт. </div>
                <button class="cards__button">Заказать</button>
            </div>
        </div>
        <div class="cards__card">
            <img src="img/img-4.svg" alt="cupcake" width="380px" height="245px" >
            <div class="cards__block">
                <div class="cards__title">Фейерверк</div>
                <div class="cards__desc">Разноцветные крем,<br>с бисквитной основой</div>
                <div class="cards__price">150 ₽/шт. </div>
                <button class="cards__button">Заказать</button>
            </div>
        </div>

    </main>
</body>
</html>
